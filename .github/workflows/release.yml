name: release

# A build arrives as a branch named incoming/<version> that holds the archive, its checksum and
# the release's notes. It becomes the release <version>, and the branch is removed: the
# repository keeps releases, not files.
on:
  push:
    branches: ["incoming/**"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Publish the release
        run: |
          version="${GITHUB_REF_NAME#incoming/}"
          if ! [[ "$version" =~ ^[0-9][0-9A-Za-z.+-]*$ ]]; then
            echo "::error::not a version: $version"
            exit 1
          fi
          sha256sum --check ./*.zip.sha256
          gh release create "$version" ./*.zip ./*.zip.sha256 --target main \
            --title "VoileJDK $version" --notes-file notes.md

      - name: Remove the branch
        if: always()
        run: git push origin --delete "$GITHUB_REF_NAME"
